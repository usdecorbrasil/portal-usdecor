name: Baixa de pagamentos

# Chama a rota de baixa automática do portal de hora em hora. O cron da
# Vercel no plano Hobby só roda uma vez por dia, então o agendamento fica
# aqui. O GitHub pode atrasar alguns minutos e pausa o agendamento se o
# repositório ficar 60 dias sem commit (avisa por e-mail; "Enable" religa).

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

jobs:
  chamar:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar /api/cron/pagamentos
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Faltam os secrets SITE_URL e/ou CRON_SECRET." >&2
            exit 1
          fi
          curl --fail --silent --show-error --max-time 90 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "${SITE_URL%/}/api/cron/pagamentos"
