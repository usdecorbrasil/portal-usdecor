name: Rollback Supabase

on:
  workflow_dispatch:
    inputs:
      migration:
        description: "Nome do arquivo em supabase/migrations (sem .sql)"
        required: true

jobs:
  rollback:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Conferir arquivo de rollback
        run: |
          test -f "supabase/rollbacks/${{ inputs.migration }}.sql" \
            || { echo "Falta supabase/rollbacks/${{ inputs.migration }}.sql"; exit 1; }

      - name: Executar rollback
        run: psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f "supabase/rollbacks/${{ inputs.migration }}.sql"

      - name: Marcar migration como revertida
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_ID"
          VERSAO=$(echo "${{ inputs.migration }}" | cut -d_ -f1)
          supabase migration repair --status reverted "$VERSAO"
